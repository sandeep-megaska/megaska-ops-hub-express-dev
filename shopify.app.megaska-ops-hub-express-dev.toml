# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "91b6af8eff2be76428980364cad07a57"
name = "megaska-ops-hub-express-dev"
application_url = "https://megaska-ops-hub-express-dev.vercel.app"
embedded = true

[app_proxy]
url = "https://megaska-ops-hub-express-dev.vercel.app/apps/megaska"
subpath = "megaska"
prefix = "apps"

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/api/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = ["customers/data_request"]
  uri = "/api/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  topics = ["customers/redact"]
  uri = "/api/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  topics = ["shop/redact"]
  uri = "/api/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "customer_read_draft_orders,read_all_orders,read_app_proxy,read_customers,read_discounts,read_draft_orders,read_orders,read_products,unauthenticated_read_checkouts,unauthenticated_read_metaobjects,unauthenticated_read_product_listings,unauthenticated_write_checkouts,write_app_proxy,write_customers,write_discounts,write_draft_orders,write_metaobject_definitions,write_orders,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://megaska-ops-hub-express-dev.vercel.app/api/auth/callback"
]
