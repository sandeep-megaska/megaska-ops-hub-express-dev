query CartValidationsGenerateRun {
  cart {
    buyerIdentity {
      phone
    }
    # The OTP hand-off stamps the verified mobile number and the chosen payment
    # intent (prepaid or cod) onto the cart, so the validation can enforce that a
    # verified checkout keeps its verified number. Both intents complete on
    # Shopify Checkout.
    verifiedPhone: attribute(key: "megaska_verified_phone") {
      value
    }
    paymentIntent: attribute(key: "loopd2c_payment_intent") {
      value
    }
    deliveryGroups {
      deliveryAddress {
        phone
        countryCode
      }
    }
  }
}
