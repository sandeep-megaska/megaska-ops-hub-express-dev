schema {
  query: Input
}

scalar Decimal
scalar ID
scalar JSON

type Input {
  discount: Discount!
  cart: Cart!
}

type Discount {
  metafield(namespace: String, key: String!): Metafield
  discountClasses: [DiscountClass!]!
}

enum DiscountClass {
  PRODUCT
  ORDER
  SHIPPING
}
enum LanguageCode {
  EN
}
type Metafield {
  value: String!
}

type Cart {
  lines: [CartLine!]!
}

type CartLine {
  id: ID!
  quantity: Int!
  cost: CartLineCost!
  merchandise: Merchandise!
}

type CartLineCost {
  subtotalAmount: MoneyV2!
}

type MoneyV2 {
  amount: Decimal!
  currencyCode: String!
}

interface Merchandise {
  id: ID!
}

type ProductVariant implements Merchandise {
  id: ID!
  product: Product!
}

type Product {
  id: ID!
  productType: String!
  tags: [String!]!
  inCollections(first: Int): [CollectionMembership!]!
}

type CollectionMembership {
  collectionId: ID!
  isMember: Boolean!
}

type CartLinesDiscountsGenerateRunResult {
  operations: [CartLinesDiscountsGenerateRunOperation!]!
}

type CartLinesDiscountsGenerateRunOperation {
  productDiscountsAdd: AddProductDiscountsOperation
}

type AddProductDiscountsOperation {
  candidates: [ProductDiscountCandidate!]!
  selectionStrategy: ProductDiscountSelectionStrategy!
}

enum ProductDiscountSelectionStrategy {
  FIRST
  MAXIMUM
  ALL
}

type ProductDiscountCandidate {
  message: String
  targets: [ProductDiscountTarget!]!
  value: ProductDiscountValue!
  associatedDiscountCode: AssociatedDiscountCode
  prerequisites: [ProductDiscountCandidatePrerequisite!]
}

type ProductDiscountTarget {
  cartLine: LineDiscountTarget
}

type LineDiscountTarget {
  id: ID!
  quantity: Int
}

type ProductDiscountValue {
  percentage: Percentage
  fixedAmount: ProductDiscountFixedAmount
}

type AssociatedDiscountCode {
  code: String!
}

type ProductDiscountCandidatePrerequisite {
  cartLine: CartLinePrerequisite
}

type CartLinePrerequisite {
  id: ID!
  quantity: Int!
}

type Percentage {
  value: Decimal!
}

type ProductDiscountFixedAmount {
  amount: Decimal!
  appliesToEachItem: Boolean
}

enum CountryCode {
  US
}

enum CurrencyCode {
  USD
}
