api_version = "2026-04"

[[extensions]]
name = "LoopDesk Discount Function"
handle = "loopdesk-discount-function"
type = "function"
description = "Universal LoopDesk promotion reward discount function foundation."

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cartLinesDiscountsGenerateRun"

  [extensions.build]
  command = "npm run build"
  path = "dist/index.wasm"
