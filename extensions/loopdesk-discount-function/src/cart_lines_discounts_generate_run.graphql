query Input {
  discount {
    discountClasses
    metafield(namespace: "loopdesk", key: "discount_function_config") {
      value
    }
  }
  cart {
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          id
        }
      }
    }
  }
}
